name: Experimental macOS arm64 build

on:
  push:
    branches: [macos-metal]
  workflow_dispatch:
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'CMake/**'
      - 'pvzPerf/**'
      - 'tools/**'
      - 'config/**'
      - 'vcpkg.json'
      - 'vcpkg-overlay-ports/**'
      - '.github/workflows/macos-build.yml'

permissions:
  contents: read

concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      VCPKG_ROOT: ${{ github.workspace }}/out/vcpkg
      PVZ_BASS_LIBRARY: ${{ github.workspace }}/out/macos-bass/libbass.dylib
      PVZ_DEVTOOLS_BIN_DIR: ${{ github.workspace }}/out/asset-library/tools/bin/Darwin-arm64
      PVZ_ASSET_LIBRARY: ${{ github.workspace }}/out/asset-library
      PVZ_MACOS_BUILD_DIR: ${{ github.workspace }}/out/arm64-cocoa-metal
      CMAKE_BUILD_PARALLEL_LEVEL: 3
      VCPKG_MAX_CONCURRENCY: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check out configured asset library
        if: vars.PVZ_ASSET_REPOSITORY != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.PVZ_ASSET_REPOSITORY }}
          ref: ${{ vars.PVZ_ASSET_REVISION }}
          token: ${{ secrets.PVZ_ASSET_READ_TOKEN || github.token }}
          persist-credentials: false
          path: out/asset-library
      - name: Check resource inputs
        run: |
          test -s "$PVZ_ASSET_LIBRARY/library.json"
          for tool in reanimc pvz-resource-build pvz_dat64_converter; do
            test -x "$PVZ_DEVTOOLS_BIN_DIR/$tool" || {
              echo "::error::Missing native Apple build input $PVZ_DEVTOOLS_BIN_DIR/$tool"
              exit 1
            }
          done
      - uses: actions/cache/restore@v4
        id: vcpkg_cache
        with:
          path: ~/.cache/vcpkg/archives
          key: macos15-arm64-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-overlay-ports/**') }}
          restore-keys: |
            macos15-arm64-vcpkg-
            macos-arm64-vcpkg-
      - name: Verify native Apple Silicon tools
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          xcodebuild -version
          xcrun --find clang++
          xcrun --find metal
          cmake --version
          ninja --version
          python3 --version
      - name: Read pinned vcpkg baseline
        id: baseline
        shell: bash
        run: |
          python3 -c 'import json, os; data = json.load(open("vcpkg.json")); print("revision=" + data["builtin-baseline"], file=open(os.environ["GITHUB_OUTPUT"], "a"))'
      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ steps.baseline.outputs.revision }}
          fetch-depth: 0
          path: out/vcpkg
      - name: Bootstrap vcpkg
        shell: bash
        run: bash "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
      - name: Download official macOS BASS runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$PVZ_BASS_LIBRARY")"
          curl --fail --location --retry 3 \
            https://www.un4seen.com/files/bass24-osx.zip \
            --output "$RUNNER_TEMP/bass24-osx.zip"
          unzip -q "$RUNNER_TEMP/bass24-osx.zip" -d "$(dirname "$PVZ_BASS_LIBRARY")"
          lipo "$PVZ_BASS_LIBRARY" -verify_arch arm64
      - name: Compile metadata tools and actual game
        shell: bash
        run: sh tools/build-macos-game.sh
      - name: Verify portable output
        shell: bash
        run: |
          set -euo pipefail
          output="$PVZ_MACOS_BUILD_DIR/Release"
          test -s "$output/pvz_perf"
          test -s "$output/main.pak64"
          test -s "$output/shaders/game.metallib"
          test -s "$output/libbass.dylib"
          test -s "$output/data/pvz_dat64_converter"
          lipo "$output/pvz_perf" -verify_arch arm64
          lipo "$output/libbass.dylib" -verify_arch arm64
          otool -L "$output/pvz_perf"
          if find "$output" -type f \( -iname '*dxil*' \
              -o -iname '*vulkan*' -o -iname '*.spv' \) | grep -q .; then
            echo 'Unexpected DXIL or Vulkan runtime asset in the native Metal artifact.' >&2
            exit 1
          fi
          test "$(find "$PVZ_MACOS_BUILD_DIR/packages" -name '*.dmg' -size +0 | wc -l)" -eq 1
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: pvz-macos-arm64
          path: out/arm64-cocoa-metal/packages/*.dmg
          if-no-files-found: error
          retention-days: 14
      - uses: actions/cache/save@v4
        if: always() && steps.vcpkg_cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/vcpkg/archives
          key: macos15-arm64-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-overlay-ports/**') }}
