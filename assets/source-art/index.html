<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>高清素材总库</title><style>
*{box-sizing:border-box}body{margin:0;background:#17291e;color:#e8efdf;font:16px/1.55 system-ui}header{position:sticky;top:0;padding:16px 22px;background:#223b2df5;z-index:3;border-bottom:1px solid #58705e}h1{font-size:25px;margin:0}header p{margin:7px 0}a{color:#c4e39f}nav{display:flex;flex-wrap:wrap;gap:8px}input,select,button{background:#314e3a;color:#eef4e8;border:1px solid #69836e;padding:8px;font:inherit}input{min-width:260px}main{padding:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:18px}article{background:#233c2c;border:1px solid #4c6853;padding:16px;min-width:0}h2{font-size:17px;overflow-wrap:anywhere;margin:0 0 8px}.meta{font-size:13px;overflow-wrap:anywhere;color:#c9d7bf}.tag{display:inline-block;padding:2px 7px;margin:2px;border:1px solid #73936a;border-radius:3px}.pending{color:#ffd389}.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}figure{margin:12px 0}figcaption{font-size:13px}.art{height:220px;background:repeating-conic-gradient(#8fa28d 0 25%,#687d69 0 50%) 0/20px 20px;display:flex;align-items:center;justify-content:center}.art img{width:100%;height:100%;object-fit:contain;cursor:zoom-in}details{margin-top:10px}ul{padding-left:18px}footer{padding:20px;display:flex;gap:12px;align-items:center}dialog{width:96vw;height:94vh;max-width:none;background:#2c4131;color:#f4f5ed;border:1px solid #789076;padding:14px}dialog .image{height:calc(100% - 90px);overflow:auto;display:flex;justify-content:center;align-items:center;background:#789078}dialog img{max-width:100%;max-height:100%;object-fit:contain}.native img{max-width:none;max-height:none}#fullpath{overflow-wrap:anywhere;font-size:13px}#summary{color:#d6e9c2}
</style><header><h1>高清素材总库</h1><p>母图保留原生／AI实际分辨率；4×只是最终PAK导出规格。按资源ID归类，历史轮次集中归档。</p><nav><input id="search" placeholder="资源名、动画名、来源文件"><select id="kind"><option value="">所有类型</option><option>images</option><option>reanim</option><option>particles</option><option>cards</option><option>fonts</option></select><select id="group"><option value="">所有分组</option></select><select id="status"><option value="scope">当前构建范围</option><option value="ready">4×导出已备好</option><option value="pending">待处理</option><option value="all">含未使用旧映射</option></select><select id="origin"><option value="">所有来源</option><option value="native">重植版原生</option><option value="ai">AI</option><option value="vector">矢量</option><option value="generated">程序／合成</option></select><button id="clear">清除筛选</button><a href="catalog.json">完整索引JSON</a><a href="README.md">整理规则</a></nav><p id="summary">读取索引…</p></header><main></main><footer><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></footer><dialog><button id="close">关闭</button><button id="actual">适应窗口／原像素</button><div id="fullpath"></div><div class="image"><img id="full"></div></dialog><script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let catalog=null,rows=[],page=0;const size=36;
const label={images:'界面／地图',reanim:'动画部件',particles:'粒子',cards:'独立卡牌',fonts:'字体'};function picture(row,title){return row?`<figure><figcaption>${esc(title)} · ${row.physicalSize.join('×')}</figcaption><div class="art"><img loading="lazy" src="/${esc(row.thumbnail)}" data-full="/${esc(row.path)}" alt="${esc(title)}"></div><div class="meta">${esc(row.path)}</div></figure>`:`<figure><figcaption>${esc(title)}</figcaption><div class="art pending">待补齐／审核</div></figure>`}
function filter(){const q=$('#search').value.trim().toLowerCase(),kind=$('#kind').value,group=$('#group').value,status=$('#status').value,origin=$('#origin').value;rows=catalog.entries.filter(e=>(!kind||e.kind===kind)&&(!group||e.group===group)&&(status==='all'||status==='scope'?status==='all'||e.status!=='outside-current-build-scope':e.status===status)&&(!origin||e.sourceKinds.includes(origin))&&(!q||JSON.stringify([e.id,e.group,e.owners,e.sources.map(x=>x.path)]).toLowerCase().includes(q)));page=0;render()}
function render(){const count=Math.ceil(rows.length/size)||1;page=Math.max(0,Math.min(page,count-1));$('main').innerHTML=rows.slice(page*size,(page+1)*size).map(e=>`<article data-id="${esc(e.id)}"><h2>${esc(e.id)}</h2><div><span class="tag">${esc(label[e.kind]||e.kind)}</span><span class="tag ${e.status==='pending'?'pending':''}">${e.status==='ready'?'4×导出已备好':e.status==='pending'?'待处理':'未使用旧映射'}</span></div><div class="meta">${esc(e.group)}${e.owners.length?' · '+esc(e.owners.join('、')):''}</div><div class="pair">${picture(e.current,'当前构建输入')}${picture(e.export4x||e.repairCandidate,e.export4x?'4×构建导出':'4×待审候选')}</div>${e.repairCandidate?`<p><a href="${esc(e.repairCandidate.reviewUrl)}">进入本轮审核页</a></p>`:''}<details><summary>母图／来源（原分辨率） · ${e.masters.length} 项</summary><ul>${e.masters.map(m=>`<li><a href="/${esc(m.path)}" ${m.physicalSize?'data-full="/'+esc(m.path)+'"':''}>${esc(m.path.split('/').pop())}</a> · ${m.physicalSize?m.physicalSize.join('×'):esc(m.type)} · ${esc(m.origin)}</li>`).join('')}</ul></details><details><summary>配方与审核</summary><p class="meta">${esc(e.pending?.finding||e.history?.method||e.pending?.reason||'旧映射，当前不在构建范围')}</p>${e.history?.reviewFile?`<a href="/${esc(e.history.reviewFile)}">审核记录</a>`:''}${e.verification?`<details open><summary>核实依据 · ${e.verification.evidence.length} 项</summary><ul>${e.verification.evidence.map(v=>`<li><a href="/${esc(v.path)}">${esc(v.path.split('/').pop())}</a>${v.physicalSize?' · '+v.physicalSize.join('×'):''}</li>`).join('')}</ul></details>`:''}<p class="meta">裁透明留白时保留逻辑画布，记录像素裁切框与位置补偿；不能用裁后尺寸重算角色大小。</p></details></article>`).join('');$('#page').textContent=`${page+1} / ${count} · 筛选 ${rows.length} 项`;$('#summary').textContent=`普通图像：${catalog.counts.readyImages} 就绪 / ${catalog.counts.pendingImages} 待处理；独立卡牌 ${catalog.counts.cards}，字体层 ${catalog.counts.fontLayers}。母图尺寸不受4×限制。${catalog.buildArtifact?.pixelScale===4?"4×开发包已构建并通过启动检查。":"当前游戏包尚未全量重建。"}`;$('#prev').disabled=page===0;$('#next').disabled=page===count-1}
fetch('catalog.json').then(r=>r.json()).then(d=>{catalog=d;groups();const params=new URLSearchParams(location.search);for(const id of ['status','kind','search'])if(params.has(id))$('#'+id).value=params.get(id);groups();filter()});function groups(){const kind=$('#kind').value;$('#group').innerHTML='<option value="">所有分组</option>'+[...new Set(catalog.entries.filter(e=>!kind||e.kind===kind).map(e=>e.group))].sort().map(g=>`<option>${esc(g)}</option>`).join('')};$('#kind').onchange=()=>{groups();filter()};for(const id of['search','group','status','origin'])$('#'+id).oninput=filter;$('#clear').onclick=()=>{for(const id of['search','kind','group','origin'])$('#'+id).value='';$('#status').value='scope';groups();filter()};$('#prev').onclick=()=>{page--;render();scrollTo(0,0)};$('#next').onclick=()=>{page++;render();scrollTo(0,0)};document.addEventListener('click',e=>{if(!e.target.dataset.full)return;e.preventDefault();$('#full').src=e.target.dataset.full;$('#fullpath').textContent=e.target.dataset.full;$('.image').classList.remove('native');$('dialog').showModal()});$('#close').onclick=()=>{$('dialog').close();$('#full').removeAttribute('src')};$('#actual').onclick=()=>$('.image').classList.toggle('native');
</script></html>
