plugins { id 'com.android.application' }
android { namespace 'com.openpvz.modern'; compileSdk 35
    defaultConfig { applicationId 'com.openpvz.modern'; minSdk 26; targetSdk 35; versionCode 1; versionName '2.0.0' }
    sourceSets { main { jniLibs.srcDirs = ['src/main/jniLibs'] } }
    packaging { jniLibs { useLegacyPackaging true }; resources { excludes += ['META-INF/*'] } }
    aaptOptions { noCompress 'pak64' }
}
