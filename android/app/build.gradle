plugins { id 'com.android.application' }
android { namespace 'com.openpvz.perf'; compileSdk 35
    lint { checkReleaseBuilds false }
    defaultConfig { applicationId 'com.openpvz.perf'; minSdk 26; targetSdk 35; versionCode 8; versionName '3.2.3' }
    sourceSets { main { jniLibs.srcDirs = ['src/main/jniLibs'] } }
    packaging { jniLibs { useLegacyPackaging true }; resources { excludes += ['META-INF/*'] } }
    aaptOptions { noCompress 'pak64' }
}
