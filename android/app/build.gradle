plugins { id 'com.android.application' }
android { namespace 'com.openpvz.perf'; compileSdk 35
    lint { checkReleaseBuilds false }
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'com.openpvz.perf'
        minSdk providers.gradleProperty('pvzMinSdk').getOrElse('34').toInteger()
        targetSdk 35
        versionCode 24
        versionName '4.0.1'
        buildConfigField 'boolean', 'HDR_DEVICE_TEST', providers.gradleProperty('pvzHdrTest').getOrElse('false')
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    sourceSets { main {
        if (providers.gradleProperty('pvzStagingDir').isPresent()) {
            def staging = providers.gradleProperty('pvzStagingDir').get()
            assets.srcDirs = [staging + '/assets']
            jniLibs.srcDirs = [staging + '/jniLibs']
        } else { jniLibs.srcDirs = ['src/main/jniLibs'] }
    } }
    packaging { jniLibs { useLegacyPackaging true }; resources { excludes += ['META-INF/*'] } }
    aaptOptions { noCompress 'pak64' }
}
